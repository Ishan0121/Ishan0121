<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="880" height="130" role="img" aria-label="Zen Engineering Philosophy">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#0F1F38"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .serif { font-family: 'Cinzel', 'Noto Serif JP', 'Georgia', serif; }
  </style>

  <!-- Frame with Hairline Border -->
  <rect width="880" height="130" rx="10" fill="url(#quoteBg)" stroke="#1D3459" stroke-width="0.75"/>
  <line x1="20" y1="0.5" x2="80" y2="0.5" stroke="#E4BFD3" stroke-width="1.2"/>

  <!-- Zen Sakura Branch Accent -->
  <circle cx="840" cy="30" r="12" fill="none" stroke="#E4BFD3" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="840" cy="30" r="4" fill="#E4BFD3" opacity="0.6"/>

  <!-- Philosophy Text -->
  <g transform="translate(36, 44)">
    <text x="0" y="0" class="mono" font-size="11" fill="#E4BFD3" letter-spacing="1.5">ENGINEERING PHILOSOPHY // 0121</text>
    <text x="0" y="28" class="serif" font-size="16" font-style="italic" fill="#EDF2F8" letter-spacing="0.2">
      “First make it local. Then make it sound. Then make it fast. Then make it beautiful.”
    </text>
    <text x="0" y="56" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.75">
      — Ishan Maiti <tspan fill="#1D3459">•</tspan> Local AI (llama.cpp) <tspan fill="#1D3459">•</tspan> MCP Agent Protocol <tspan fill="#1D3459">•</tspan> Arch Linux
    </text>
  </g>
</svg>