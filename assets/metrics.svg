    <text x="28" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#C4D2E3" fill-opacity="0.8">Merged: Wallpaper Deck plugin &amp; updates</text>

