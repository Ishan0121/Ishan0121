<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Zen Systems Diagnostic Console">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#0F1F38"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
  </style>

  <!-- Terminal Frame -->
  <rect width="880" height="190" rx="10" fill="url(#termBg)" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Window Header Bar -->
  <line x1="0" y1="32" x2="880" y2="32" stroke="#1D3459" stroke-width="0.75"/>
  <circle cx="22" cy="16" r="4.5" fill="#E4BFD3" opacity="0.9"/>
  <circle cx="38" cy="16" r="4.5" fill="#F2D8A7" opacity="0.9"/>
  <circle cx="54" cy="16" r="4.5" fill="#C4D2E3" opacity="0.9"/>
  <text x="76" y="20" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.8">ishan@arch-zen: ~/systems-core</text>
  <text x="860" y="20" text-anchor="end" class="mono" font-size="10.5" fill="#E4BFD3">MCP-SERVER // ONLINE</text>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 56)">
    <!-- Command Prompt -->
    <text x="0" y="0" class="mono" font-size="12" fill="#F2D8A7">ishan@zen:~$ <tspan fill="#EDF2F8">local-ai --runtime=llama.cpp --protocol=mcp --status</tspan></text>
    
    <!-- Status Lines -->
    <text x="0" y="24" class="mono" font-size="11.5" fill="#C4D2E3"><tspan fill="#E4BFD3">[✓]</tspan> Inference Engine  : <tspan fill="#EDF2F8">llama.cpp</tspan> (GGUF quantizations • low-latency local execution)</text>
    <text x="0" y="46" class="mono" font-size="11.5" fill="#C4D2E3"><tspan fill="#F2D8A7">[✓]</tspan> Context Protocol  : <tspan fill="#EDF2F8">Model Context Protocol (MCP)</tspan> tool-calling daemon ready</text>
    <text x="0" y="68" class="mono" font-size="11.5" fill="#C4D2E3"><tspan fill="#89B4FA">[✓]</tspan> Agentic Memory    : <tspan fill="#EDF2F8">Persistent vector stores</tspan> + semantic context retrieval active</text>
    <text x="0" y="90" class="mono" font-size="11.5" fill="#C4D2E3"><tspan fill="#A6E3A1">[✓]</tspan> Full-Stack &amp; OS   : <tspan fill="#EDF2F8">Next.js WebGL Lab</tspan> • PostgreSQL • Arch/Wayland desktop shell</text>
    <text x="0" y="112" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.6">-- ALL SUBSYSTEMS NOMINAL // READY FOR NEW BUILDS --</text>
  </g>
</svg>