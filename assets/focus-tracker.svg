<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" role="img" aria-label="Current Engineering Focus">
  <defs>
    <linearGradient id="focBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#0F1F38"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="170" rx="10" fill="url(#focBg)" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Header -->
  <text x="24" y="30" class="sans" font-size="14.5" font-weight="700" fill="#EDF2F8">🎯 Active Engineering &amp; Research Focus // 2026</text>
  <text x="856" y="30" text-anchor="end" class="mono" font-size="10.5" fill="#E4BFD3">CURRENT SPRINT</text>
  <line x1="24" y1="42" x2="856" y2="42" stroke="#1D3459" stroke-width="0.75"/>

  <!-- 4 Tracks -->
  <g transform="translate(24, 62)">
    <!-- Track 1 -->
    <text x="0" y="0" class="mono" font-size="11" fill="#E4BFD3">[01] LOCAL AI</text>
    <text x="120" y="0" class="sans" font-size="12" fill="#EDF2F8">llama.cpp Quantizations <tspan fill="#C4D2E3">— Low-latency GGUF inference, batch token decoding &amp; KV cache</tspan></text>
    <rect x="760" y="-12" width="96" height="18" rx="9" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
    <text x="808" y="0" text-anchor="middle" class="mono" font-size="9" fill="#A6E3A1">● ACTIVE R&amp;D</text>

    <!-- Track 2 -->
    <text x="0" y="26" class="mono" font-size="11" fill="#F2D8A7">[02] MCP SERVERS</text>
    <text x="120" y="26" class="sans" font-size="12" fill="#EDF2F8">Model Context Protocol <tspan fill="#C4D2E3">— Custom tool servers, JSON-RPC daemons &amp; agentic routing</tspan></text>
    <rect x="760" y="14" width="96" height="18" rx="9" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
    <text x="808" y="26" text-anchor="middle" class="mono" font-size="9" fill="#A6E3A1">● ACTIVE R&amp;D</text>

    <!-- Track 3 -->
    <text x="0" y="52" class="mono" font-size="11" fill="#89B4FA">[03] AGENT MEMORY</text>
    <text x="120" y="52" class="sans" font-size="12" fill="#EDF2F8">Vector Semantic RAG <tspan fill="#C4D2E3">— Persistent state stores, context compaction &amp; tool memory</tspan></text>
    <rect x="760" y="40" width="96" height="18" rx="9" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
    <text x="808" y="52" text-anchor="middle" class="mono" font-size="9" fill="#A6E3A1">● ACTIVE R&amp;D</text>

    <!-- Track 4 -->
    <text x="0" y="78" class="mono" font-size="11" fill="#A6E3A1">[04] WEB &amp; 3D LAB</text>
    <text x="120" y="78" class="sans" font-size="12" fill="#EDF2F8">Next.js 14 + WebGL <tspan fill="#C4D2E3">— Full-stack reactive architectures, PostgreSQL &amp; 3D canvas lab</tspan></text>
    <rect x="760" y="66" width="96" height="18" rx="9" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
    <text x="808" y="78" text-anchor="middle" class="mono" font-size="9" fill="#EDF2F8">● PRODUCTION</text>
  </g>
</svg>
