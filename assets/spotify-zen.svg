<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="880" height="120" role="img" aria-label="Zen Focus Coding Player">
  <defs>
    <linearGradient id="audioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#0F1F38"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="120" rx="10" fill="url(#audioBg)" stroke="#1D3459" stroke-width="0.75"/>
  <line x1="20" y1="0.5" x2="80" y2="0.5" stroke="#E4BFD3" stroke-width="1.2"/>

  <!-- Album Art Block -->
  <g transform="translate(24, 20)">
    <rect width="80" height="80" rx="8" fill="#0B162C" stroke="#1D3459" stroke-width="0.75"/>
    <circle cx="40" cy="40" r="28" fill="none" stroke="#E4BFD3" stroke-width="0.75" stroke-opacity="0.4"/>
    <circle cx="40" cy="40" r="14" fill="none" stroke="#F2D8A7" stroke-width="0.75" stroke-opacity="0.6"/>
    <circle cx="40" cy="40" r="5" fill="#E4BFD3"/>
  </g>

  <!-- Track Info -->
  <g transform="translate(120, 36)">
    <text x="0" y="0" class="mono" font-size="10" fill="#E4BFD3" letter-spacing="1">CODING FOCUS // AUDIO STREAM</text>
    <text x="0" y="20" class="sans" font-size="14" font-weight="700" fill="#EDF2F8">Deep Work — Local AI &amp; MCP Architecture</text>
    <text x="0" y="38" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.75">Spring Night Hairline Zen • Ishan Maiti Workspace</text>
  </g>

  <!-- Progress Bar & Controls -->
  <g transform="translate(560, 42)">
    <!-- Equalizer Visualizer -->
    <rect x="0" y="4" width="4" height="16" rx="2" fill="#E4BFD3"/>
    <rect x="8" y="0" width="4" height="20" rx="2" fill="#F2D8A7"/>
    <rect x="16" y="8" width="4" height="12" rx="2" fill="#89B4FA"/>
    <rect x="24" y="2" width="4" height="18" rx="2" fill="#E4BFD3"/>
    <rect x="32" y="6" width="4" height="14" rx="2" fill="#A6E3A1"/>

    <!-- Time & Bar -->
    <text x="48" y="16" class="mono" font-size="10.5" fill="#C4D2E3">02:48</text>
    <line x1="90" y1="12" x2="230" y2="12" stroke="#1D3459" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="12" x2="185" y2="12" stroke="#E4BFD3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="185" cy="12" r="5" fill="#F2D8A7"/>
    <text x="238" y="16" class="mono" font-size="10.5" fill="#C4D2E3">04:20</text>
    <text x="286" y="16" class="mono" font-size="10.5" fill="#A6E3A1">● 432Hz</text>
  </g>
</svg>
