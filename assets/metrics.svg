    <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#C4D2E3" fill-opacity="0.6">Stack: llama.cpp • MCP • Next.js • React • TypeScript • Python • C++ • QML • Bash • Docker</text>
