<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 145" width="440" height="145" role="img" aria-label="Local AI &amp; MCP CLI Runtime">
  <defs>
    <linearGradient id="cardGrad_cli" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#0B162C"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="440" height="145" rx="8" fill="url(#cardGrad_cli)" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Terminal Window Bar -->
  <rect x="0" y="0" width="440" height="26" rx="8" fill="#0F1F38" stroke="#1D3459" stroke-width="0.75"/>
  <circle cx="16" cy="13" r="4" fill="#E4BFD3" opacity="0.9"/>
  <circle cx="28" cy="13" r="4" fill="#F2D8A7" opacity="0.9"/>
  <circle cx="40" cy="13" r="4" fill="#89B4FA" opacity="0.9"/>
  <text x="56" y="17" class="mono" font-size="10" fill="#C4D2E3">llama-mcp-daemon // v1.0.4</text>
  <text x="424" y="17" text-anchor="end" class="mono" font-size="9.5" fill="#A6E3A1">● PORT:8080</text>

  <!-- Terminal Body -->
  <g transform="translate(14, 44)">
    <text x="0" y="0" class="mono" font-size="11" fill="#F2D8A7">$ <tspan fill="#EDF2F8">llama-server -m models/llama-3.gguf --mcp</tspan></text>
    <text x="0" y="18" class="mono" font-size="10" fill="#C4D2E3"><tspan fill="#E4BFD3">[engine]</tspan> llama.cpp KV-cache allocated (32k ctx)</text>
    <text x="0" y="34" class="mono" font-size="10" fill="#C4D2E3"><tspan fill="#89B4FA">[mcp]</tspan> Model Context Protocol: 12 tools active</text>
    <text x="0" y="50" class="mono" font-size="10" fill="#C4D2E3"><tspan fill="#A6E3A1">[memory]</tspan> Vector store semantic indexing ready</text>
  </g>

  <!-- Footer Hairline -->
  <line x1="14" y1="108" x2="426" y2="108" stroke="#1D3459" stroke-width="0.5"/>
  <g transform="translate(14, 128)">
    <circle cx="4" cy="-4" r="3" fill="#E4BFD3"/>
    <text x="14" y="0" class="mono" font-size="10" fill="#C4D2E3">C++ / Python / GGUF / MCP</text>
    <text x="230" y="0" class="mono" font-size="10" fill="#F2D8A7">★ Autonomous Agents</text>
    <text x="412" y="0" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#EDF2F8">CLI Spec ↗</text>
  </g>
</svg>
