<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Workstation &amp; Engineering Specs">
  <defs>
    <linearGradient id="specBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="50%" stop-color="#0B162C"/>
      <stop offset="100%" stop-color="#0F1F38"/>
    </linearGradient>
    <linearGradient id="specCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B162C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="200" rx="10" fill="url(#specBg)" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Header -->
  <text x="24" y="32" class="sans" font-size="14.5" font-weight="700" fill="#EDF2F8">⚙️ Workstation, Runtime &amp; Homelab Environment</text>
  <text x="856" y="32" text-anchor="end" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.7">Arch Linux • x86_64 • Local R&amp;D</text>
  <line x1="24" y1="44" x2="856" y2="44" stroke="#1D3459" stroke-width="0.75"/>

  <!-- 3 Columns -->
  <g transform="translate(24, 60)">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <rect width="265" height="122" rx="6" fill="url(#specCard)" stroke="#1D3459" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="#E4BFD3" stroke-width="1.5"/>
      <text x="14" y="22" class="mono" font-size="10.5" font-weight="700" fill="#E4BFD3">01 // LINUX &amp; DESKTOP</text>
      <text x="14" y="42" class="mono" font-size="10" fill="#C4D2E3">OS: <tspan fill="#EDF2F8">Garuda / Arch Linux</tspan></text>
      <text x="14" y="60" class="mono" font-size="10" fill="#C4D2E3">Shell: <tspan fill="#EDF2F8">Bash &amp; Zsh (Starship)</tspan></text>
      <text x="14" y="78" class="mono" font-size="10" fill="#C4D2E3">Display: <tspan fill="#EDF2F8">Wayland Compositor</tspan></text>
      <text x="14" y="96" class="mono" font-size="10" fill="#C4D2E3">Theme: <tspan fill="#EDF2F8">SDDM Custom / Noctalia</tspan></text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(284, 0)">
      <rect width="265" height="122" rx="6" fill="url(#specCard)" stroke="#1D3459" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="#F2D8A7" stroke-width="1.5"/>
      <text x="14" y="22" class="mono" font-size="10.5" font-weight="700" fill="#F2D8A7">02 // LOCAL AI ENGINE</text>
      <text x="14" y="42" class="mono" font-size="10" fill="#C4D2E3">Inference: <tspan fill="#EDF2F8">llama.cpp (GGUF)</tspan></text>
      <text x="14" y="60" class="mono" font-size="10" fill="#C4D2E3">Protocol: <tspan fill="#EDF2F8">Model Context Protocol (MCP)</tspan></text>
      <text x="14" y="78" class="mono" font-size="10" fill="#C4D2E3">Memory: <tspan fill="#EDF2F8">Vector Store / Embeddings</tspan></text>
      <text x="14" y="96" class="mono" font-size="10" fill="#C4D2E3">Agents: <tspan fill="#EDF2F8">Autonomous Tool-Calling</tspan></text>
    </g>

    <!-- Col 3 -->
    <g transform="translate(568, 0)">
      <rect width="265" height="122" rx="6" fill="url(#specCard)" stroke="#1D3459" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="#89B4FA" stroke-width="1.5"/>
      <text x="14" y="22" class="mono" font-size="10.5" font-weight="700" fill="#89B4FA">03 // HARDWARE &amp; INFRA</text>
      <text x="14" y="42" class="mono" font-size="10" fill="#C4D2E3">Embedded: <tspan fill="#EDF2F8">ESP32-S3 (Wi-Fi/BLE)</tspan></text>
      <text x="14" y="60" class="mono" font-size="10" fill="#C4D2E3">Container: <tspan fill="#EDF2F8">Docker &amp; Podman</tspan></text>
      <text x="14" y="78" class="mono" font-size="10" fill="#C4D2E3">Networking: <tspan fill="#EDF2F8">Cloudflare Tunnels</tspan></text>
      <text x="14" y="96" class="mono" font-size="10" fill="#C4D2E3">Editor: <tspan fill="#EDF2F8">Neovim (Luau) &amp; VS Code</tspan></text>
    </g>
  </g>
</svg>
