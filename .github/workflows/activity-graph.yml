name: Activity Graph

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate activity graph
        uses: ashutosh00710/github-readme-activity-graph@v0.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: Ishan0121
          theme: github-compact
          output: assets/activity-graph.svg
      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity graph"
          file_pattern: assets/activity-graph.svg
