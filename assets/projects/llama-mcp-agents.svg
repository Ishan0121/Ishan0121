<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 145" width="440" height="145" role="img" aria-label="Local AI &amp; MCP Agent Runtime">
  <defs>
    <linearGradient id="cardGrad_llama_mcp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B162C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Card Background with hairline border -->
  <rect width="440" height="145" rx="8" fill="url(#cardGrad_llama_mcp)" stroke="#1D3459" stroke-width="0.75"/>
  
  <!-- Subtle top accent hairline -->
  <line x1="16" y1="0.5" x2="140" y2="0.5" stroke="#E4BFD3" stroke-width="0.75" stroke-opacity="0.7"/>

  <!-- Header: Icon, Title & Badge -->
  <g transform="translate(20, 24)">
    <!-- Node / Agent Icon -->
    <svg width="15" height="15" viewBox="0 0 16 16" fill="#E4BFD3" opacity="0.9">
      <path fill-rule="evenodd" d="M8 1.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM4 4a4 4 0 117.5 1.93l2.853 2.854a.75.75 0 01-1.06 1.06l-2.067-2.066A4.002 4.002 0 018 9a3.99 3.99 0 01-2.226-.676L3.707 10.39a.75.75 0 01-1.06-1.06L5.5 6.477A3.978 3.978 0 014 4zm-1.25 8a.75.75 0 000 1.5h10.5a.75.75 0 000-1.5H2.75z"/>
    </svg>
    <text x="24" y="12" class="sans" font-size="14.5" font-weight="700" fill="#EDF2F8" letter-spacing="-0.2">Local AI &amp; MCP Agent Runtime</text>
    
    <!-- Hairline Pill Badge -->
    <rect x="315" y="-3" width="85" height="20" rx="10" fill="#0B162C" stroke="#C4D2E3" stroke-width="0.5" stroke-opacity="0.35"/>
    <text x="357.5" y="10" text-anchor="middle" class="mono" font-size="9.5" fill="#E4BFD3">Active R&amp;D</text>
  </g>

  <!-- Description -->
  <text x="20" y="64" class="sans" font-size="12" fill="#EDF2F8" fill-opacity="0.88">High-performance quantized LLM inference with llama.cpp, custom</text>
  <text x="20" y="82" class="sans" font-size="12" fill="#C4D2E3" fill-opacity="0.72">Model Context Protocol (MCP) servers, and persistent agent memory.</text>

  <!-- Footer Metadata & Hairline Divider -->
  <line x1="20" y1="102" x2="420" y2="102" stroke="#1D3459" stroke-width="0.5" stroke-opacity="0.6"/>
  <g transform="translate(20, 124)">
    <circle cx="5" cy="-4" r="3" fill="#F2D8A7" opacity="0.85"/>
    <text x="14" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.8">llama.cpp / MCP / Python / C++</text>
    
    <text x="210" y="0" class="mono" font-size="10.5" fill="#E4BFD3" fill-opacity="0.85">★ Agents &amp; Memory</text>
    <text x="400" y="0" text-anchor="end" class="mono" font-size="10.5" font-weight="600" fill="#EDF2F8">Architecture ↗</text>
  </g>
</svg>