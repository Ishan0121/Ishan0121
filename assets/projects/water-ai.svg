<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 145" width="440" height="145" role="img" aria-label="WaterAI">
  <defs>
    <linearGradient id="cardGrad_water-ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B162C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Card Background with hairline border -->
  <rect width="440" height="145" rx="8" fill="url(#cardGrad_water-ai)" stroke="#1D3459" stroke-width="0.75"/>
  
  <!-- Subtle top accent hairline -->
  <line x1="16" y1="0.5" x2="120" y2="0.5" stroke="#E4BFD3" stroke-width="0.75" stroke-opacity="0.7"/>

  <!-- Header: Icon, Title & Badge -->
  <g transform="translate(20, 24)">
    <!-- Minimal Repo / Node Icon -->
    <svg width="15" height="15" viewBox="0 0 16 16" fill="#E4BFD3" opacity="0.9">
      <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8z"/>
    </svg>
    <text x="24" y="12" class="sans" font-size="14.5" font-weight="700" fill="#EDF2F8" letter-spacing="-0.2">WaterAI</text>
    
    <!-- Hairline Pill Badge -->
    <rect x="315" y="-3" width="85" height="20" rx="10" fill="#0B162C" stroke="#C4D2E3" stroke-width="0.5" stroke-opacity="0.35"/>
    <text x="357.5" y="10" text-anchor="middle" class="mono" font-size="9.5" fill="#E4BFD3">Public Repo</text>
  </g>

  <!-- Description -->
  <text x="20" y="64" class="sans" font-size="12" fill="#EDF2F8" fill-opacity="0.88">Lightweight web application for smart water quality &amp; hydration</text>
  <text x="20" y="82" class="sans" font-size="12" fill="#C4D2E3" fill-opacity="0.72">analytics with responsive frontend telemetry visualization.</text>

  <!-- Footer Metadata & Hairline Divider -->
  <line x1="20" y1="102" x2="420" y2="102" stroke="#1D3459" stroke-width="0.5" stroke-opacity="0.6"/>
  <g transform="translate(20, 124)">
    <circle cx="5" cy="-4" r="3" fill="#F2D8A7" opacity="0.85"/>
    <text x="14" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.8">JavaScript / CSS</text>
    
    <text x="210" y="0" class="mono" font-size="10.5" fill="#E4BFD3" fill-opacity="0.85">★ 2 Stars</text>
    <text x="400" y="0" text-anchor="end" class="mono" font-size="10.5" font-weight="600" fill="#EDF2F8">View Repo ↗</text>
  </g>
</svg>