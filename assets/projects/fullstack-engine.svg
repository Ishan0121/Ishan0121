<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 145" width="440" height="145" role="img" aria-label="Modern Full-Stack Web Architecture">
  <defs>
    <linearGradient id="cardGrad_fullstack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B162C" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Card Background with hairline border -->
  <rect width="440" height="145" rx="8" fill="url(#cardGrad_fullstack)" stroke="#1D3459" stroke-width="0.75"/>
  
  <!-- Subtle top accent hairline -->
  <line x1="16" y1="0.5" x2="140" y2="0.5" stroke="#F2D8A7" stroke-width="0.75" stroke-opacity="0.7"/>

  <!-- Header: Icon, Title & Badge -->
  <g transform="translate(20, 24)">
    <!-- Web / Server Icon -->
    <svg width="15" height="15" viewBox="0 0 16 16" fill="#F2D8A7" opacity="0.9">
      <path fill-rule="evenodd" d="M1.5 2.75C1.5 2.06 2.06 1.5 2.75 1.5h10.5c.69 0 1.25.56 1.25 1.25v2.5c0 .69-.56 1.25-1.25 1.25H2.75A1.25 1.25 0 011.5 5.25v-2.5zm1.25-.25a.25.25 0 00-.25.25v2.5c0 .25.25.25.25.25h10.5a.25.25 0 00.25-.25v-2.5a.25.25 0 00-.25-.25H2.75zM1.5 10.75c0-.69.56-1.25 1.25-1.25h10.5c.69 0 1.25.56 1.25 1.25v2.5c0 .69-.56 1.25-1.25 1.25H2.75A1.25 1.25 0 011.5 13.25v-2.5zm1.25-.25a.25.25 0 00-.25.25v2.5c0 .25.25.25.25.25h10.5a.25.25 0 00.25-.25v-2.5a.25.25 0 00-.25-.25H2.75z"/>
    </svg>
    <text x="24" y="12" class="sans" font-size="14.5" font-weight="700" fill="#EDF2F8" letter-spacing="-0.2">Full-Stack Reactive Architecture</text>
    
    <!-- Hairline Pill Badge -->
    <rect x="315" y="-3" width="85" height="20" rx="10" fill="#0B162C" stroke="#C4D2E3" stroke-width="0.5" stroke-opacity="0.35"/>
    <text x="357.5" y="10" text-anchor="middle" class="mono" font-size="9.5" fill="#F2D8A7">Production</text>
  </g>

  <!-- Description -->
  <text x="20" y="64" class="sans" font-size="12" fill="#EDF2F8" fill-opacity="0.88">End-to-end web architectures featuring reactive client frontends,</text>
  <text x="20" y="82" class="sans" font-size="12" fill="#C4D2E3" fill-opacity="0.72">type-safe APIs, PostgreSQL/MongoDB databases &amp; Docker containerization.</text>

  <!-- Footer Metadata & Hairline Divider -->
  <line x1="20" y1="102" x2="420" y2="102" stroke="#1D3459" stroke-width="0.5" stroke-opacity="0.6"/>
  <g transform="translate(20, 124)">
    <circle cx="5" cy="-4" r="3" fill="#89B4FA" opacity="0.85"/>
    <text x="14" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.8">Next.js / TypeScript / PostgreSQL</text>
    
    <text x="210" y="0" class="mono" font-size="10.5" fill="#F2D8A7" fill-opacity="0.85">★ Full-Stack Web</text>
    <text x="400" y="0" text-anchor="end" class="mono" font-size="10.5" font-weight="600" fill="#EDF2F8">Explore ↗</text>
  </g>
</svg>