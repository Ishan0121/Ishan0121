  <text x="362" y="276" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c0caf5">B.Sc. CS @ Vidyasagar University</text>

  <text x="635" y="276" font-family="'JetBrains Mono', monospace" font-size="12" fill="#565f89">PORTFOLIO:</text>
  <text x="718" y="276" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#7dcfff">ishan0121.vercel.app ↗</text>
