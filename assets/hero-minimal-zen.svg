<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ishan Maiti Minimalist Zen Hero Banner">
  <defs>
    <linearGradient id="zenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1B"/>
      <stop offset="50%" stop-color="#0B162C"/>
      <stop offset="100%" stop-color="#0E1E38"/>
    </linearGradient>
    <linearGradient id="zenCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B162C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4BFD3"/>
      <stop offset="100%" stop-color="#F2D8A7"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .serif-zen { font-family: 'Cinzel', 'Noto Serif JP', 'Georgia', serif; }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="320" rx="12" fill="url(#zenBg)" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Subtle Zen Enso / Geometric Rings -->
  <circle cx="1060" cy="160" r="130" fill="none" stroke="#E4BFD3" stroke-width="0.75" stroke-opacity="0.12" stroke-dasharray="4 6"/>
  <circle cx="1060" cy="160" r="85" fill="none" stroke="#C4D2E3" stroke-width="0.5" stroke-opacity="0.15"/>
  <circle cx="1060" cy="160" r="40" fill="none" stroke="#F2D8A7" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Top Zen Index Bar -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" class="mono" font-size="11" fill="#E4BFD3" letter-spacing="2">0121 // SYSTEM IDENTIFIER</text>
    <text x="340" y="0" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.6">ARCH LINUX (WAYLAND) • OPEN SOURCE</text>
    <text x="760" y="0" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.6">ORCID: 0009-0001-9389-807X</text>
    
    <!-- Status Pill -->
    <rect x="970" y="-12" width="130" height="20" rx="10" fill="#0F1F38" stroke="#1D3459" stroke-width="0.75"/>
    <circle cx="984" cy="-2" r="3" fill="#F2D8A7"/>
    <text x="1040" y="1" text-anchor="middle" class="mono" font-size="9.5" fill="#EDF2F8">ONLINE // 2026</text>
  </g>

  <!-- Hairline Divider -->
  <line x1="50" y1="56" x2="1150" y2="56" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Main Hero Titles -->
  <text x="50" y="112" class="sans" font-size="38" font-weight="800" fill="#EDF2F8" letter-spacing="-0.5">Ishan Maiti</text>
  <text x="300" y="112" class="mono" font-size="20" font-weight="600" fill="url(#sakuraGrad)">@Ishan0121</text>
  <text x="50" y="140" class="sans" font-size="14.5" font-weight="500" fill="#C4D2E3" letter-spacing="0.5">
    Computer Science Scholar • Systems Engineer • Autonomous AI Architect
  </text>

  <!-- 3 Zen Architecture Pillars -->
  <g transform="translate(50, 168)">
    <!-- Column 1: Local AI & MCP -->
    <g transform="translate(0, 0)">
      <rect width="350" height="90" rx="8" fill="url(#zenCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#E4BFD3" stroke-width="1.5"/>
      <text x="16" y="24" class="mono" font-size="10.5" font-weight="700" fill="#E4BFD3" letter-spacing="1">01 // LOCAL AI &amp; AGENTS</text>
      <text x="16" y="48" class="sans" font-size="13.5" font-weight="600" fill="#EDF2F8">llama.cpp &amp; MCP Servers</text>
      <text x="16" y="70" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">GGUF Quantization • Vector Memory • Tools</text>
    </g>

    <!-- Column 2: Web & 3D Lab -->
    <g transform="translate(375, 0)">
      <rect width="350" height="90" rx="8" fill="url(#zenCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#F2D8A7" stroke-width="1.5"/>
      <text x="16" y="24" class="mono" font-size="10.5" font-weight="700" fill="#F2D8A7" letter-spacing="1">02 // REACTIVE WEB &amp; 3D</text>
      <text x="16" y="48" class="sans" font-size="13.5" font-weight="600" fill="#EDF2F8">Full-Stack &amp; DNA Engine</text>
      <text x="16" y="70" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">Next.js • TypeScript • Three.js • PostgreSQL</text>
    </g>

    <!-- Column 3: Systems & Shell -->
    <g transform="translate(750, 0)">
      <rect width="350" height="90" rx="8" fill="url(#zenCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="32" y2="0" stroke="#89B4FA" stroke-width="1.5"/>
      <text x="16" y="24" class="mono" font-size="10.5" font-weight="700" fill="#89B4FA" letter-spacing="1">03 // LINUX &amp; HARDWARE</text>
      <text x="16" y="48" class="sans" font-size="13.5" font-weight="600" fill="#EDF2F8">Wayland Plugins &amp; ESP32</text>
      <text x="16" y="70" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">Arch Linux • Noctalia v5 • QML • ESP32-S3</text>
    </g>
  </g>

  <!-- Bottom Hairline Footer Strip -->
  <line x1="50" y1="282" x2="1150" y2="282" stroke="#1D3459" stroke-width="0.75"/>
  <g transform="translate(50, 302)">
    <text x="0" y="0" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.7">LIVE PORTFOLIO: <tspan fill="#E4BFD3">ishan0121.vercel.app</tspan></text>
    <text x="350" y="0" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.7">DEGREE: <tspan fill="#EDF2F8">B.Sc. in Computer Science (2023–2027)</tspan></text>
    <text x="800" y="0" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.7">STATUS: <tspan fill="#F2D8A7">Available for High-Impact Collaborations</tspan></text>
  </g>
</svg>