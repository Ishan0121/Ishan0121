    <text x="28" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#C4D2E3" fill-opacity="0.8">Noctalia v5 daemon &amp; Compose manager</text>
