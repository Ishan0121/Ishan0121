<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" role="img" aria-label="Ishan Maiti Cyber Zen HUD Console">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C18"/>
      <stop offset="50%" stop-color="#0B162C"/>
      <stop offset="100%" stop-color="#0D1A33"/>
    </linearGradient>
    <linearGradient id="hudCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hudGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4BFD3"/>
      <stop offset="50%" stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#F2D8A7"/>
    </linearGradient>
    <pattern id="hudGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1D3459" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="1" fill="#C4D2E3" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="320" rx="10" fill="url(#hudBg)" stroke="#1D3459" stroke-width="0.75"/>
  <rect width="1200" height="320" rx="10" fill="url(#hudGrid)"/>

  <!-- HUD Corner Tech Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#E4BFD3" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 1184 36 L 1184 16 L 1164 16" fill="none" stroke="#E4BFD3" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 16 284 L 16 304 L 36 304" fill="none" stroke="#E4BFD3" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M 1184 284 L 1184 304 L 1164 304" fill="none" stroke="#E4BFD3" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Top Status Bar -->
  <g transform="translate(44, 38)">
    <circle cx="6" cy="-4" r="3.5" fill="#A6E3A1"/>
    <text x="18" y="0" class="mono" font-size="11" fill="#A6E3A1" letter-spacing="1">SYSTEM // ONLINE</text>
    <text x="210" y="0" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.6">SYS: <tspan fill="#EDF2F8">Garuda/Arch Linux (Wayland)</tspan></text>
    <text x="560" y="0" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.6">RUNTIME: <tspan fill="#E4BFD3">llama.cpp + MCP v1.0</tspan></text>
    <text x="890" y="0" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.6">STATUS: <tspan fill="#F2D8A7">ACTIVE // PRODUCTION</tspan></text>
    <text x="1112" y="0" text-anchor="end" class="mono" font-size="11" fill="#89B4FA">HUD // v2026.11</text>
  </g>
  <line x1="44" y1="50" x2="1156" y2="50" stroke="#1D3459" stroke-width="0.75"/>

  <!-- Identity Centerpiece -->
  <g transform="translate(44, 98)">
    <text x="0" y="0" class="sans" font-size="34" font-weight="800" fill="#EDF2F8" letter-spacing="-0.5">Ishan Maiti</text>
    <text x="236" y="0" class="mono" font-size="18" font-weight="600" fill="url(#hudGlow)">@Ishan0121</text>
    <text x="430" y="-3" class="mono" font-size="11" fill="#C4D2E3" fill-opacity="0.5">/* CS UNDERGRADUATE // SYSTEMS ENGINEER */</text>

    <text x="0" y="26" class="sans" font-size="14" font-weight="600" fill="#E4BFD3" letter-spacing="0.5">
      Local AI Inference (llama.cpp) • Model Context Protocol (MCP) • Persistent Vector Memory • Full-Stack Web
    </text>
  </g>

  <!-- 4 HUD Telemetry Gauges -->
  <g transform="translate(44, 150)">
    <!-- Gauge 1: Llama.cpp Local Inference -->
    <g transform="translate(0, 0)">
      <rect width="265" height="108" rx="6" fill="url(#hudCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#E4BFD3" stroke-width="1.5"/>
      <text x="14" y="24" class="mono" font-size="10.5" font-weight="700" fill="#E4BFD3">01 // INFERENCE ENGINE</text>
      <text x="14" y="46" class="sans" font-size="13" font-weight="700" fill="#EDF2F8">llama.cpp Runtime</text>
      <text x="14" y="66" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">GGUF Quantization • AVX2</text>
      <!-- Gauge Bar -->
      <rect x="14" y="78" width="237" height="6" rx="3" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
      <rect x="14" y="78" width="200" height="6" rx="3" fill="#E4BFD3"/>
      <text x="14" y="98" class="mono" font-size="9" fill="#A6E3A1">● ACTIVE // Low-Latency Local</text>
    </g>

    <!-- Gauge 2: MCP Tool Protocol -->
    <g transform="translate(282, 0)">
      <rect width="265" height="108" rx="6" fill="url(#hudCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#F2D8A7" stroke-width="1.5"/>
      <text x="14" y="24" class="mono" font-size="10.5" font-weight="700" fill="#F2D8A7">02 // PROTOCOL DAEMON</text>
      <text x="14" y="46" class="sans" font-size="13" font-weight="700" fill="#EDF2F8">Model Context Protocol</text>
      <text x="14" y="66" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">Custom Tool Servers • JSON-RPC</text>
      <!-- Gauge Bar -->
      <rect x="14" y="78" width="237" height="6" rx="3" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
      <rect x="14" y="78" width="185" height="6" rx="3" fill="#F2D8A7"/>
      <text x="14" y="98" class="mono" font-size="9" fill="#A6E3A1">● READY // Dynamic Tool Dispatch</text>
    </g>

    <!-- Gauge 3: Agentic Vector Memory -->
    <g transform="translate(564, 0)">
      <rect width="265" height="108" rx="6" fill="url(#hudCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#89B4FA" stroke-width="1.5"/>
      <text x="14" y="24" class="mono" font-size="10.5" font-weight="700" fill="#89B4FA">03 // AGENTIC MEMORY</text>
      <text x="14" y="46" class="sans" font-size="13" font-weight="700" fill="#EDF2F8">Persistent Vector Store</text>
      <text x="14" y="66" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">Semantic Retrieval • RAG Cache</text>
      <!-- Gauge Bar -->
      <rect x="14" y="78" width="237" height="6" rx="3" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
      <rect x="14" y="78" width="215" height="6" rx="3" fill="#89B4FA"/>
      <text x="14" y="98" class="mono" font-size="9" fill="#A6E3A1">● SYNCED // Context Retention</text>
    </g>

    <!-- Gauge 4: Full-Stack & 3D Web -->
    <g transform="translate(846, 0)">
      <rect width="265" height="108" rx="6" fill="url(#hudCardGrad)" stroke="#1D3459" stroke-width="0.75"/>
      <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#A6E3A1" stroke-width="1.5"/>
      <text x="14" y="24" class="mono" font-size="10.5" font-weight="700" fill="#A6E3A1">04 // FULL-STACK &amp; 3D</text>
      <text x="14" y="46" class="sans" font-size="13" font-weight="700" fill="#EDF2F8">Next.js &amp; WebGL Engine</text>
      <text x="14" y="66" class="mono" font-size="10" fill="#C4D2E3" fill-opacity="0.8">TypeScript • Three.js • PostgreSQL</text>
      <!-- Gauge Bar -->
      <rect x="14" y="78" width="237" height="6" rx="3" fill="#0B162C" stroke="#1D3459" stroke-width="0.5"/>
      <rect x="14" y="78" width="225" height="6" rx="3" fill="#A6E3A1"/>
      <text x="14" y="98" class="mono" font-size="9" fill="#A6E3A1">● DEPLOYED // ishan0121.vercel.app</text>
    </g>
  </g>

  <!-- Bottom Hairline Grid Strip -->
  <line x1="44" y1="276" x2="1156" y2="276" stroke="#1D3459" stroke-width="0.75"/>
  <g transform="translate(44, 296)">
    <text x="0" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.7">INDEX: <tspan fill="#EDF2F8">0121</tspan></text>
    <text x="130" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.7">PORTFOLIO: <tspan fill="#E4BFD3">https://ishan0121.vercel.app</tspan></text>
    <text x="430" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.7">ORCID: <tspan fill="#EDF2F8">0009-0001-9389-807X</tspan></text>
    <text x="660" y="0" class="mono" font-size="10.5" fill="#C4D2E3" fill-opacity="0.7">AFFILIATION: <tspan fill="#EDF2F8">Vidyasagar University (2023–2027)</tspan></text>
    <text x="1112" y="0" text-anchor="end" class="mono" font-size="10.5" fill="#F2D8A7">● STABLE // PROD</text>
  </g>
</svg>
